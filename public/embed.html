<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provar em Mim — Vestê</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; background: #050510; color: #f5f5f7; margin: 0; min-height: 100vh; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .bg-mesh { background: radial-gradient(at 30% 30%, rgba(127,119,221,0.25) 0px, transparent 50%), radial-gradient(at 70% 70%, rgba(99,102,241,0.15) 0px, transparent 50%); }
  .glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); }
  .glass-strong { background: rgba(255,255,255,0.06); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.12); }
  .gradient-text { background: linear-gradient(135deg, #fff 0%, #b8a5ff 50%, #7f77dd 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .btn-primary { background: linear-gradient(135deg, #7f77dd 0%, #5d4dd6 100%); box-shadow: 0 0 30px rgba(127,119,221,0.4); transition: all 0.3s; }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 0 50px rgba(127,119,221,0.6); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }
  @keyframes scan { 0%{transform:translateY(-100%);} 100%{transform:translateY(200%);} }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  @keyframes fade-up { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
  .blink { animation: blink 2s ease-in-out infinite; }
  .fade-up { animation: fade-up 0.5s ease-out; }
  .scan-line { position: relative; overflow: hidden; }
  .scan-line::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,#7f77dd,transparent); animation: scan 3s linear infinite; pointer-events:none; }
  .glass-input { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); color:#f5f5f7; }
  .glass-input:focus { outline:none; border-color:rgba(127,119,221,0.5); }
  .glass-input::placeholder { color:rgba(255,255,255,0.3); }
  .hidden { display: none !important; }
</style>
</head>
<body class="bg-mesh">

<div class="max-w-2xl mx-auto px-4 py-6 min-h-screen">

  <header class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #7f77dd 0%, #5d4dd6 100%);">
        <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3l1.5 1.5L8 3l1.5 1.5L11 3l1.5 1.5L14 3l1.5 1.5L17 3v18l-1.5-1.5L14 21l-1.5-1.5L11 21l-1.5-1.5L8 21l-1.5-1.5L5 21V3z"/></svg>
      </div>
      <span class="font-bold tracking-tight">vestê<span class="text-violet-400">.ai</span></span>
    </div>
    <button onclick="window.parent.postMessage({type:'veste-close'}, '*'); window.close();" class="mono text-xs text-white/60 hover:text-white px-3 py-1.5 rounded-full glass">✕ FECHAR</button>
  </header>

  <div id="garmentInfo" class="hidden glass rounded-2xl p-3 mb-4 flex items-center gap-3">
    <img id="garmentThumb" class="w-12 h-12 rounded-lg object-cover" />
    <div class="flex-1 min-w-0">
      <div class="mono text-[10px] text-violet-300/80 mb-0.5">PEÇA SELECIONADA</div>
      <div id="garmentName" class="text-sm font-medium truncate">—</div>
    </div>
  </div>

  <div id="step-indicator" class="flex justify-center gap-1.5 mb-6">
    <div data-step="1" class="step-dot h-1 rounded-full bg-violet-500 w-10"></div>
    <div data-step="2" class="step-dot h-1 rounded-full bg-white/10 w-5"></div>
    <div data-step="3" class="step-dot h-1 rounded-full bg-white/10 w-5"></div>
    <div data-step="4" class="step-dot h-1 rounded-full bg-white/10 w-5"></div>
  </div>

  <div class="glass-strong rounded-2xl p-5 fade-up">

    <div id="step1" class="step-content">
      <div class="flex items-baseline gap-2 mb-1">
        <span class="mono text-xs text-violet-300/80">[ 01 ]</span>
        <h3 class="text-xl font-semibold">Sua foto</h3>
      </div>
      <p class="text-white/50 mb-5 text-xs">Corpo inteiro, fundo limpo, braços ao lado.</p>
      <label for="personFile" class="block scan-line border border-dashed border-white/10 hover:border-violet-400/50 rounded-xl p-8 text-center cursor-pointer transition aspect-[4/3] flex flex-col items-center justify-center bg-white/[0.02]">
        <div id="personPlaceholder">
          <svg class="w-10 h-10 text-violet-300/60 mb-3 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          <p class="font-medium mb-1 text-white/80 text-sm">Selecione sua foto</p>
          <p class="mono text-[10px] text-white/40">PNG · JPG</p>
        </div>
        <img id="personPreview" class="max-h-full rounded-xl hidden" />
        <input type="file" id="personFile" accept="image/*" class="hidden" />
      </label>
      <div class="flex justify-end mt-5">
        <button id="btnNext1" disabled class="btn-primary text-white px-5 py-2.5 rounded-full text-sm font-medium">
          Continuar →
        </button>
      </div>
    </div>

    <div id="step2" class="step-content hidden">
      <div class="flex items-baseline gap-2 mb-1">
        <span class="mono text-xs text-violet-300/80">[ 02 ]</span>
        <h3 class="text-xl font-semibold">Seus dados</h3>
      </div>
      <p class="text-white/50 mb-5 text-xs">Pra recomendar o tamanho ideal.</p>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mono text-[10px] text-violet-300/80 tracking-wider">ALTURA (CM)</label>
          <input type="number" id="altura" placeholder="170" class="glass-input w-full mt-1.5 px-3 py-2.5 rounded-lg text-sm" />
        </div>
        <div>
          <label class="mono text-[10px] text-violet-300/80 tracking-wider">PESO (KG)</label>
          <input type="number" id="peso" placeholder="70" class="glass-input w-full mt-1.5 px-3 py-2.5 rounded-lg text-sm" />
        </div>
        <div class="col-span-2">
          <label class="mono text-[10px] text-violet-300/80 tracking-wider">E-MAIL</label>
          <input type="email" id="email" placeholder="voce@email.com" class="glass-input w-full mt-1.5 px-3 py-2.5 rounded-lg text-sm" />
        </div>
        <div class="col-span-2">
          <label class="mono text-[10px] text-violet-300/80 tracking-wider">WHATSAPP (OPCIONAL)</label>
          <input type="tel" id="whatsapp" placeholder="(11) 99999-9999" class="glass-input w-full mt-1.5 px-3 py-2.5 rounded-lg text-sm" />
        </div>
      </div>
      <div id="processError" class="hidden mt-3 p-3 rounded-lg glass border border-red-500/30 text-red-300 text-xs"></div>
      <div class="flex justify-between mt-5">
        <button onclick="goToStep(1)" class="px-4 py-2.5 rounded-full text-sm font-medium glass hover:bg-white/5 transition">Voltar</button>
        <button id="btnProcess" class="btn-primary text-white px-5 py-2.5 rounded-full text-sm font-medium">
          Materializar →
        </button>
      </div>
    </div>

    <div id="step3" class="step-content hidden text-center py-12">
      <div class="relative w-20 h-20 mx-auto mb-6">
        <div class="absolute inset-0 rounded-full border-2 border-violet-500/20"></div>
        <div class="absolute inset-0 rounded-full border-2 border-transparent border-t-violet-400 animate-spin"></div>
        <div class="absolute inset-2 rounded-full glass flex items-center justify-center">
          <svg class="w-7 h-7 text-violet-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 3l1.5 1.5L8 3l1.5 1.5L11 3l1.5 1.5L14 3l1.5 1.5L17 3v18l-1.5-1.5L14 21l-1.5-1.5L11 21l-1.5-1.5L8 21l-1.5-1.5L5 21V3z"/></svg>
        </div>
      </div>
      <h3 class="text-xl font-semibold mb-2 gradient-text">Materializando...</h3>
      <p id="loadingMessage" class="mono text-xs text-violet-300/80">[ ANALYZING_BIOMETRY ]</p>
      <p class="mono text-[10px] text-white/40 mt-3">~15s · FASHN v1.6</p>
    </div>

    <div id="step4" class="step-content hidden fade-up">
      <div class="flex items-center justify-between mb-5">
        <div>
          <span class="mono text-[10px] text-violet-300/80 tracking-widest">// COMPLETED</span>
          <h3 class="text-xl font-semibold gradient-text mt-0.5">Pronto.</h3>
        </div>
        <button onclick="resetApp()" class="mono text-xs text-violet-300 hover:text-white">↺ NOVO</button>
      </div>
      <div class="aspect-[3/4] rounded-xl overflow-hidden glass scan-line mb-4">
        <img id="resultImage" class="w-full h-full object-cover" />
      </div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <div class="glass rounded-lg p-3 text-center">
          <div class="mono text-[9px] text-violet-300/80 mb-0.5">SIZE</div>
          <div id="resTamanho" class="text-2xl font-bold gradient-text">M</div>
        </div>
        <div class="glass rounded-lg p-3 text-center">
          <div class="mono text-[9px] text-violet-300/80 mb-0.5">BIOTYPE</div>
          <div id="resBiotipo" class="text-xs font-medium">—</div>
        </div>
        <div class="glass rounded-lg p-3 text-center">
          <div class="mono text-[9px] text-violet-300/80 mb-0.5">BMI</div>
          <div id="resIMC" class="text-xs font-medium">—</div>
        </div>
      </div>
      <p id="resDicas" class="text-xs leading-relaxed text-white/70 mb-4 px-1">—</p>
      <div class="flex gap-2">
        <a id="resDownload" download="resultado.png" class="flex-1 glass text-white text-center px-4 py-3 rounded-full text-sm font-medium hover:bg-white/5 transition">↓ Salvar</a>
        <button id="btnComprar" onclick="window.parent.postMessage({type:'veste-buy'}, '*');" class="flex-1 btn-primary text-white px-4 py-3 rounded-full text-sm font-medium">Comprar →</button>
      </div>
    </div>

  </div>
</div>

<script>
let currentStep = 1;
let personImage = null;
let clothingImage = null;
let productInfo = { name: '', url: '' };

// Lê parâmetros da URL: ?garment=URL_DA_PEÇA&name=NOME_PRODUTO
const params = new URLSearchParams(window.location.search);
const garmentUrl = params.get('garment');
const productName = params.get('name') || '';

if (garmentUrl) {
  productInfo.url = garmentUrl;
  productInfo.name = productName;
  // Carrega a imagem do produto
  fetch(garmentUrl)
    .then(r => r.blob())
    .then(blob => {
      const reader = new FileReader();
      reader.onloadend = () => {
        clothingImage = reader.result;
        document.getElementById('garmentThumb').src = reader.result;
        document.getElementById('garmentName').textContent = productName || 'Peça selecionada';
        document.getElementById('garmentInfo').classList.remove('hidden');
      };
      reader.readAsDataURL(blob);
    })
    .catch(err => console.error('Erro ao carregar imagem do produto:', err));
}

async function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let maxSize = 1024, quality = 0.8, dataUrl;
        const tryC = () => {
          const canvas = document.createElement('canvas');
          let { width, height } = img;
          if (width > height && width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; }
          else if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          return (dataUrl.length * 3) / 4;
        };
        let bytes = tryC();
        while (bytes > 1200000 && (maxSize > 600 || quality > 0.5)) {
          if (quality > 0.55) quality -= 0.1; else maxSize -= 100;
          bytes = tryC();
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function goToStep(n) {
  document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('step' + n).classList.remove('hidden');
  document.querySelectorAll('.step-dot').forEach((el, i) => {
    el.className = (i + 1 <= n)
      ? 'step-dot h-1 rounded-full bg-violet-500 w-10'
      : 'step-dot h-1 rounded-full bg-white/10 w-5';
  });
  currentStep = n;
}

function resetApp() {
  personImage = null;
  document.getElementById('personFile').value = '';
  document.getElementById('personPreview').classList.add('hidden');
  document.getElementById('personPlaceholder').classList.remove('hidden');
  document.getElementById('btnNext1').disabled = true;
  ['altura','peso','email','whatsapp'].forEach(id => document.getElementById(id).value = '');
  goToStep(1);
}

document.getElementById('personFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const placeholder = document.getElementById('personPlaceholder');
  placeholder.innerHTML = '<p class="mono text-xs text-violet-300 blink">[ COMPRESSING... ]</p>';
  try {
    personImage = await compressImage(file);
    const preview = document.getElementById('personPreview');
    preview.src = personImage;
    preview.classList.remove('hidden');
    placeholder.classList.add('hidden');
    document.getElementById('btnNext1').disabled = false;
  } catch (err) { alert('Erro ao processar a imagem.'); }
});

document.getElementById('btnNext1').addEventListener('click', () => {
  if (!document.getElementById('btnNext1').disabled) goToStep(2);
});

document.getElementById('btnProcess').addEventListener('click', async () => {
  const altura = document.getElementById('altura').value;
  const peso = document.getElementById('peso').value;
  const email = document.getElementById('email').value;
  const errBox = document.getElementById('processError');
  errBox.classList.add('hidden');

  if (!altura || !peso || !email) {
    errBox.textContent = 'Preencha altura, peso e e-mail.';
    errBox.classList.remove('hidden');
    return;
  }
  if (!clothingImage) {
    errBox.textContent = 'Imagem da peça não carregou. Recarregue a página.';
    errBox.classList.remove('hidden');
    return;
  }

  goToStep(3);
  const msgEl = document.getElementById('loadingMessage');
  const messages = ['[ ANALYZING_BIOMETRY ]','[ DETECTING_SILHOUETTE ]','[ MAPPING_BODY_3D ]','[ ANALYZING_FABRIC ]','[ COMPUTING_FIT ]','[ RENDERING_OUTPUT ]','[ FINALIZING... ]'];
  let msgIdx = 0;
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % messages.length;
    msgEl.textContent = messages[msgIdx];
  }, 2500);

  try {
    const safeFetch = async (url, body) => {
      const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const text = await resp.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { error: text.slice(0, 200) }; }
      if (!resp.ok) throw new Error(data.error || `Erro ${resp.status}`);
      return data;
    };

    const [analysis, tryOn] = await Promise.all([
      safeFetch('/api/size-analysis', { altura, peso }),
      safeFetch('/api/tryon', { person_image: personImage, garment_image: clothingImage })
    ]);

    clearInterval(msgInterval);

    document.getElementById('resTamanho').textContent = analysis.tamanho;
    document.getElementById('resBiotipo').textContent = analysis.biotipo;
    document.getElementById('resIMC').textContent = analysis.imc;
    document.getElementById('resDicas').textContent = analysis.dicas;
    document.getElementById('resultImage').src = tryOn.image_url;
    document.getElementById('resDownload').href = tryOn.image_url;

    goToStep(4);
  } catch (err) {
    clearInterval(msgInterval);
    document.getElementById('processError').textContent = err.message;
    document.getElementById('processError').classList.remove('hidden');
    goToStep(2);
  }
});
</script>

</body>
</html>
