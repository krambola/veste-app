<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Provar em Mim — Vestê</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #050510;
  color: #f5f5f7;
  min-height: 100vh;
  background-image:
    radial-gradient(at 30% 30%, rgba(127,119,221,0.25) 0px, transparent 50%),
    radial-gradient(at 70% 70%, rgba(99,102,241,0.15) 0px, transparent 50%);
}
.mono { font-family: 'JetBrains Mono', monospace; }
.container { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
.hidden { display: none !important; }

/* Header */
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, #7f77dd 0%, #5d4dd6 100%);
  display: flex; align-items: center; justify-content: center;
}
.logo-text { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.logo-text .ai { color: #b8a5ff; }
.btn-close {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.6);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 6px 12px;
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-close:hover { color: #fff; background: rgba(255,255,255,0.08); }

/* Garment info */
.garment-info {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 12px;
}
.garment-thumb { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
.garment-text { flex: 1; min-width: 0; }
.garment-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(184,165,255,0.8); margin-bottom: 2px; }
.garment-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Step indicator */
.steps { display: flex; justify-content: center; gap: 6px; margin-bottom: 24px; }
.step-dot { height: 4px; width: 24px; border-radius: 99px; background: rgba(255,255,255,0.1); transition: all 0.3s; }
.step-dot.active { width: 40px; background: #7f77dd; }

/* Card */
.card {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 20px;
  animation: fadeUp 0.5s ease-out;
}
@keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }

/* Step header */
.step-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.step-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(184,165,255,0.8); }
.step-title { font-size: 20px; font-weight: 600; }
.step-desc { color: rgba(255,255,255,0.5); font-size: 12px; margin-bottom: 20px; }

/* Upload area */
.upload-area {
  border: 1px dashed rgba(255,255,255,0.15);
  border-radius: 16px;
  padding: 32px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  background: rgba(255,255,255,0.02);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  aspect-ratio: 4/3;
  position: relative;
  overflow: hidden;
}
.upload-area:hover { border-color: rgba(127,119,221,0.5); background: rgba(255,255,255,0.04); }
.upload-area::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #7f77dd, transparent);
  animation: scan 3s linear infinite;
}
@keyframes scan { 0%{transform:translateY(-100%);} 100%{transform:translateY(2400%);} }
.upload-icon { width: 40px; height: 40px; color: rgba(184,165,255,0.6); margin-bottom: 12px; }
.upload-text { font-weight: 500; color: rgba(255,255,255,0.8); font-size: 14px; margin-bottom: 4px; }
.upload-hint { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); }
.preview-img { max-height: 100%; max-width: 100%; border-radius: 12px; }

/* Inputs */
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; }
.field-full { grid-column: span 2; }
.field-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(184,165,255,0.8);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.field-input {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: #f5f5f7;
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  transition: all 0.2s;
}
.field-input::placeholder { color: rgba(255,255,255,0.3); }
.field-input:focus {
  outline: none;
  border-color: rgba(127,119,221,0.5);
  background: rgba(255,255,255,0.06);
}

/* Buttons */
.btn-row { display: flex; justify-content: space-between; margin-top: 20px; gap: 12px; }
.btn-row.right { justify-content: flex-end; }
.btn {
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: all 0.3s;
  font-family: inherit;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn-secondary {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: #f5f5f7;
}
.btn-secondary:hover { background: rgba(255,255,255,0.08); }
.btn-primary {
  background: linear-gradient(135deg, #7f77dd 0%, #5d4dd6 100%);
  color: #fff;
  box-shadow: 0 0 30px rgba(127,119,221,0.4);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 0 50px rgba(127,119,221,0.6);
  transform: translateY(-1px);
}
.btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

/* Error */
.error-box {
  margin-top: 12px;
  padding: 12px;
  background: rgba(239,68,68,0.1);
  border: 1px solid rgba(239,68,68,0.3);
  border-radius: 8px;
  color: #fca5a5;
  font-size: 12px;
}

/* Loading */
.loading { text-align: center; padding: 48px 0; }
.loading-spinner {
  width: 80px; height: 80px;
  margin: 0 auto 24px;
  position: relative;
}
.loading-spinner::before, .loading-spinner::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid transparent;
}
.loading-spinner::before {
  border-color: rgba(127,119,221,0.2);
}
.loading-spinner::after {
  border-top-color: #b8a5ff;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-title {
  font-size: 20px; font-weight: 600;
  background: linear-gradient(135deg, #fff 0%, #b8a5ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.loading-status { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: rgba(184,165,255,0.8); }
.loading-info { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 12px; }

/* Result */
.result-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.result-title-block .label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: rgba(184,165,255,0.8);
  letter-spacing: 0.5px;
}
.result-title-block .title {
  font-size: 20px; font-weight: 600;
  background: linear-gradient(135deg, #fff 0%, #b8a5ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-top: 2px;
}
.btn-restart {
  background: none; border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; color: #b8a5ff; cursor: pointer;
}
.result-image-wrap {
  aspect-ratio: 3/4;
  border-radius: 16px;
  overflow: hidden;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 16px;
  position: relative;
}
.result-image-wrap::after {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, #7f77dd, transparent);
  animation: scan 3s linear infinite;
}
.result-image { width: 100%; height: 100%; object-fit: cover; }
.result-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.stat-card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 10px 8px;
  text-align: center;
}
.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: rgba(184,165,255,0.8);
  margin-bottom: 4px;
}
.stat-value-big {
  font-size: 22px; font-weight: 700;
  background: linear-gradient(135deg, #fff 0%, #b8a5ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-value-small { font-size: 12px; font-weight: 500; }
.result-tip {
  font-size: 12px;
  line-height: 1.5;
  color: rgba(255,255,255,0.7);
  margin-bottom: 16px;
  padding: 0 4px;
}
.result-actions { display: flex; gap: 8px; }
.result-actions a, .result-actions button {
  flex: 1; padding: 12px;
  border-radius: 99px;
  text-align: center;
  text-decoration: none;
  font-size: 14px; font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l1.5 1.5L8 3l1.5 1.5L11 3l1.5 1.5L14 3l1.5 1.5L17 3v18l-1.5-1.5L14 21l-1.5-1.5L11 21l-1.5-1.5L8 21l-1.5-1.5L5 21V3z"/></svg>
      </div>
      <span class="logo-text">vestê<span class="ai">.ai</span></span>
    </div>
    <button onclick="window.parent.postMessage({type:'veste-close'}, '*'); window.close();" class="btn-close">✕ FECHAR</button>
  </header>

  <div id="garmentInfo" class="garment-info hidden">
    <img id="garmentThumb" class="garment-thumb" />
    <div class="garment-text">
      <div class="garment-label">PEÇA SELECIONADA</div>
      <div id="garmentName" class="garment-name">—</div>
    </div>
  </div>

  <div class="steps">
    <div data-step="1" class="step-dot active"></div>
    <div data-step="2" class="step-dot"></div>
    <div data-step="3" class="step-dot"></div>
    <div data-step="4" class="step-dot"></div>
  </div>

  <div class="card">

    <!-- STEP 1 -->
    <div id="step1" class="step-content">
      <div class="step-header">
        <span class="step-num">[ 01 ]</span>
        <h3 class="step-title">Sua foto</h3>
      </div>
      <p class="step-desc">Corpo inteiro, fundo limpo, braços ao lado.</p>
      <label for="personFile" class="upload-area">
        <div id="personPlaceholder">
          <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
          <p class="upload-text">Selecione sua foto</p>
          <p class="upload-hint">PNG · JPG</p>
        </div>
        <img id="personPreview" class="preview-img hidden" />
        <input type="file" id="personFile" accept="image/*" style="display:none" />
      </label>
      <div class="btn-row right">
        <button id="btnNext1" disabled class="btn btn-primary">Continuar →</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step-content hidden">
      <div class="step-header">
        <span class="step-num">[ 02 ]</span>
        <h3 class="step-title">Seus dados</h3>
      </div>
      <p class="step-desc">Pra recomendar o tamanho ideal.</p>
      <div class="field-grid">
        <div class="field">
          <label class="field-label">ALTURA (CM)</label>
          <input type="number" id="altura" placeholder="170" class="field-input" />
        </div>
        <div class="field">
          <label class="field-label">PESO (KG)</label>
          <input type="number" id="peso" placeholder="70" class="field-input" />
        </div>
        <div class="field field-full">
          <label class="field-label">E-MAIL</label>
          <input type="email" id="email" placeholder="voce@email.com" class="field-input" />
        </div>
        <div class="field field-full">
          <label class="field-label">WHATSAPP (OPCIONAL)</label>
          <input type="tel" id="whatsapp" placeholder="(11) 99999-9999" class="field-input" />
        </div>
      </div>
      <div id="processError" class="error-box hidden"></div>
      <div class="btn-row">
        <button onclick="goToStep(1)" class="btn btn-secondary">Voltar</button>
        <button id="btnProcess" class="btn btn-primary">Materializar →</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="step-content hidden loading">
      <div class="loading-spinner"></div>
      <h3 class="loading-title">Materializando...</h3>
      <p id="loadingMessage" class="loading-status">[ ANALYZING_BIOMETRY ]</p>
      <p class="loading-info">~15s · NEURAL ENGINE</p>
    </div>

    <!-- STEP 4 -->
    <div id="step4" class="step-content hidden">
      <div class="result-header">
        <div class="result-title-block">
          <span class="label">// COMPLETED</span>
          <h3 class="title">Pronto.</h3>
        </div>
        <button onclick="resetApp()" class="btn-restart">↺ NOVO</button>
      </div>
      <div class="result-image-wrap">
        <img id="resultImage" class="result-image" />
      </div>
      <div class="result-stats">
        <div class="stat-card">
          <div class="stat-label">SIZE</div>
          <div id="resTamanho" class="stat-value-big">M</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">BIOTYPE</div>
          <div id="resBiotipo" class="stat-value-small">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">BMI</div>
          <div id="resIMC" class="stat-value-small">—</div>
        </div>
      </div>
      <p id="resDicas" class="result-tip">—</p>
      <div class="result-actions">
        <a id="resDownload" download="resultado.png" class="btn btn-secondary">↓ Salvar</a>
        <button onclick="window.parent.postMessage({type:'veste-buy'}, '*');" class="btn btn-primary">Comprar →</button>
      </div>
    </div>

  </div>
</div>

<script>
let currentStep = 1;
let personImage = null;
let clothingImage = null;

const params = new URLSearchParams(window.location.search);
const garmentUrl = params.get('garment');
const productName = params.get('name') || '';

if (garmentUrl) {
  fetch(garmentUrl)
    .then(r => r.blob())
    .then(blob => {
      const reader = new FileReader();
      reader.onloadend = () => {
        clothingImage = reader.result;
        document.getElementById('garmentThumb').src = reader.result;
        document.getElementById('garmentName').textContent = productName || 'Peça selecionada';
        document.getElementById('garmentInfo').classList.remove('hidden');
      };
      reader.readAsDataURL(blob);
    })
    .catch(err => console.error('Erro ao carregar imagem:', err));
}

async function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let maxSize = 1024, quality = 0.8, dataUrl;
        const tryC = () => {
          const canvas = document.createElement('canvas');
          let { width, height } = img;
          if (width > height && width > maxSize) { height = Math.round((height * maxSize) / width); width = maxSize; }
          else if (height > maxSize) { width = Math.round((width * maxSize) / height); height = maxSize; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          dataUrl = canvas.toDataURL('image/jpeg', quality);
          return (dataUrl.length * 3) / 4;
        };
        let bytes = tryC();
        while (bytes > 1200000 && (maxSize > 600 || quality > 0.5)) {
          if (quality > 0.55) quality -= 0.1; else maxSize -= 100;
          bytes = tryC();
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function goToStep(n) {
  document.querySelectorAll('.step-content').forEach(el => el.classList.add('hidden'));
  document.getElementById('step' + n).classList.remove('hidden');
  document.querySelectorAll('.step-dot').forEach((el, i) => {
    if (i + 1 <= n) el.classList.add('active');
    else el.classList.remove('active');
  });
  currentStep = n;
}

function resetApp() {
  personImage = null;
  document.getElementById('personFile').value = '';
  document.getElementById('personPreview').classList.add('hidden');
  document.getElementById('personPlaceholder').classList.remove('hidden');
  document.getElementById('btnNext1').disabled = true;
  ['altura','peso','email','whatsapp'].forEach(id => document.getElementById(id).value = '');
  goToStep(1);
}

document.getElementById('personFile').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  const placeholder = document.getElementById('personPlaceholder');
  placeholder.innerHTML = '<p class="loading-status">[ COMPRESSING... ]</p>';
  try {
    personImage = await compressImage(file);
    const preview = document.getElementById('personPreview');
    preview.src = personImage;
    preview.classList.remove('hidden');
    placeholder.classList.add('hidden');
    document.getElementById('btnNext1').disabled = false;
  } catch (err) { alert('Erro ao processar imagem.'); }
});

document.getElementById('btnNext1').addEventListener('click', () => {
  if (!document.getElementById('btnNext1').disabled) goToStep(2);
});

document.getElementById('btnProcess').addEventListener('click', async () => {
  const altura = document.getElementById('altura').value;
  const peso = document.getElementById('peso').value;
  const email = document.getElementById('email').value;
  const errBox = document.getElementById('processError');
  errBox.classList.add('hidden');

  if (!altura || !peso || !email) {
    errBox.textContent = 'Preencha altura, peso e e-mail.';
    errBox.classList.remove('hidden');
    return;
  }
  if (!clothingImage) {
    errBox.textContent = 'Imagem da peça não carregou. Recarregue a página.';
    errBox.classList.remove('hidden');
    return;
  }

  goToStep(3);
  const msgEl = document.getElementById('loadingMessage');
  const messages = ['[ ANALYZING_BIOMETRY ]','[ DETECTING_SILHOUETTE ]','[ MAPPING_BODY_3D ]','[ ANALYZING_FABRIC ]','[ COMPUTING_FIT ]','[ RENDERING_OUTPUT ]','[ FINALIZING... ]'];
  let msgIdx = 0;
  const msgInterval = setInterval(() => {
    msgIdx = (msgIdx + 1) % messages.length;
    msgEl.textContent = messages[msgIdx];
  }, 2500);

  try {
    const safeFetch = async (url, body) => {
      const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const text = await resp.text();
      let data;
      try { data = JSON.parse(text); } catch { data = { error: text.slice(0, 200) }; }
      if (!resp.ok) throw new Error(data.error || 'Erro ' + resp.status);
      return data;
    };

    const [analysis, tryOn] = await Promise.all([
      safeFetch('/api/size-analysis', { altura, peso }),
      safeFetch('/api/tryon', { person_image: personImage, garment_image: clothingImage })
    ]);

    clearInterval(msgInterval);

    document.getElementById('resTamanho').textContent = analysis.tamanho;
    document.getElementById('resBiotipo').textContent = analysis.biotipo;
    document.getElementById('resIMC').textContent = analysis.imc;
    document.getElementById('resDicas').textContent = analysis.dicas;
    document.getElementById('resultImage').src = tryOn.image_url;
    document.getElementById('resDownload').href = tryOn.image_url;

    goToStep(4);
  } catch (err) {
    clearInterval(msgInterval);
    document.getElementById('processError').textContent = err.message;
    document.getElementById('processError').classList.remove('hidden');
    goToStep(2);
  }
});
</script>

</body>
</html>
